spring.application.name=fintrack
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fintrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:fintrack_app}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
server.error.include-stacktrace=never
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=120
app.cors.origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
app.demo.enabled=${DEMO_ENABLED:false}
app.demo.password=${DEMO_PASSWORD:}
spring.config.import=optional:file:./application.properties
